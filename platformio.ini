; PixoTicker replacement firmware
; Target: ESP32 (4 MB flash, no PSRAM), HUB75 panel, two 64x64 modules.
; Flash path: OTA only (POST /u), so the app image MUST stay small.

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
  -Os
  -DCORE_DEBUG_LEVEL=1
  -DPIXEL_COLOR_DEPTH_BITS=4

lib_deps =
  adafruit/Adafruit GFX Library@^1.11.11
  ; pinned to the commit the panel was verified on, not a moving branch
  https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git#65d575273cff0be4c18c9d5204b79f6c6f5038e2

; First push: identical firmware with panel init compiled out.
; Proves Wi-Fi + HTTP + OTA before any panel config can hang the boot.
[env:safe]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPXT_PANEL_DISABLED=1

; Local serial builds only. OTA (/u) never rewrites the partition table.
board_build.partitions = default.csv
